<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Мытьё окна: чистая полоса после сгона">
<title>Мытьё окна: чистая полоса после сгона</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6E1"/><stop offset="1" stop-color="#F4F2EB"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7DF" stop-opacity=".75"/><stop offset="1" stop-color="#FFF7DF" stop-opacity="0"/></linearGradient>
  <linearGradient id="wallLight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DA49F"/><stop offset=".5" stop-color="#E4E7E4"/><stop offset="1" stop-color="#A7AEA9"/></linearGradient>
  <pattern id="dust" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1.6" fill="#8C8578" opacity=".5"/><circle cx="17" cy="3" r="1" fill="#8C8578" opacity=".45"/><circle cx="12" cy="17" r="2" fill="#9A927F" opacity=".35"/><circle cx="22" cy="21" r="1.2" fill="#8C8578" opacity=".5"/><circle cx="6" cy="23" r=".9" fill="#8C8578" opacity=".4"/></pattern>
  <pattern id="haze" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#C9C2B2" opacity=".28"/><circle cx="8" cy="10" r="3" fill="#A9A08C" opacity=".25"/><circle cx="28" cy="26" r="4" fill="#A9A08C" opacity=".2"/><path d="M0 34 Q 12 30 22 36 T 40 33" stroke="#A9A08C" stroke-width="1.5" fill="none" opacity=".25"/></pattern>
</defs>

